name: Deploy Dentara Website to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Debug OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          echo "OIDC token URL is available"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"
          echo "Repository Owner ID: $GITHUB_REPOSITORY_OWNER_ID"
          echo "Branch: $GITHUB_REF"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::559846026467:role/DentaraGitHubS3Deploy
          aws-region: eu-north-1

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://dentarawebsite \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"